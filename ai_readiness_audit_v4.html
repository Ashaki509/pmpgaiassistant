<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readiness Audit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>AI Readiness Audit</h1>
        <form id="auditForm">
            <!-- Other form fields -->
            <button type="submit">Submit</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        document.getElementById('auditForm').onsubmit = function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const auditData = {};
            formData.forEach((value, key) => {
                auditData[key] = value;
            });
            // Call the backend endpoint instead of Claude API
            fetch('/api/generate-report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(auditData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerText = data.report;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        };
    </script>
</body>
</html>
